[package]
name = "modelscope-sync-core"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "process", "rt", "macros"] }
futures = "0.3"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.0"
tokio-test = "0.4"
